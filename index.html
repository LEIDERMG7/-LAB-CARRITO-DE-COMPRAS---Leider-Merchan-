<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mini Tienda</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
<nav class="navbar navbar-dark bg-dark px-4">
  <span class="navbar-brand mb-0 h1">🛒 Mi Tienda</span>
  <span class="badge bg-danger fs-6" id="badge">0</span>
</nav>
<div class="container mt-5">
  <h2 class="text-center mb-4">Productos</h2>
  <div class="row g-4">
    <!-- Producto 1 -->
    <div class="col-md-3">
      <div class="card">
        <img src="imagenes/zapatos.png" class="card-img-top">
        <div class="card-body text-center">
          <h5 class="card-title">Zapatos</h5>
          <p>$120000</p>
          <button class="btn btn-primary btn-agregar"
                  data-nombre="Zapatos"
                  data-precio="120000">
            Agregar
          </button>
        </div>
      </div>
    </div>

    <!-- Producto 2 -->
    <div class="col-md-3">
      <div class="card">
        <img src="imagenes/camisaaa.png" class="card-img-top">
        <div class="card-body text-center">
          <h5 class="card-title">Camisa</h5>
          <p>$80000</p>
          <button class="btn btn-primary btn-agregar"
                  data-nombre="Camisa"
                  data-precio="80000">
            Agregar
          </button>
        </div>
      </div>
    </div>

    <!-- Producto 3 -->
    <div class="col-md-3">
      <div class="card">
        <img src="imagenes/gorra.png" class="card-img-top">
        <div class="card-body text-center">
          <h5 class="card-title">Gorra</h5>
          <p>$40000</p>
          <button class="btn btn-primary btn-agregar"
                  data-nombre="Gorra"
                  data-precio="40000">
            Agregar
          </button>
        </div>
      </div>
    </div>

    <!-- Producto 4 -->
    <div class="col-md-3">
      <div class="card">
        <img src="imagenes/chaqueta.png" class="card-img-top">
        <div class="card-body text-center">
          <h5 class="card-title">Chaqueta</h5>
          <p>$150000</p>
          <button class="btn btn-primary btn-agregar"
                  data-nombre="Chaqueta"
                  data-precio="150000">
            Agregar
          </button>
        </div>
      </div>
    </div>

  </div>


  <div class="mt-5">
    <h2>Carrito</h2>

    <ul id="lista-carrito" class="list-group mb-3">
      <li id="msg-vacio" class="list-group-item text-muted">
        Tu carrito está vacío
      </li>
    </ul>

    <h4>Total: <span id="total">$0</span></h4>

    <button id="btn-vaciar" class="btn btn-danger mt-2">
      Vaciar carrito
    </button>
    <button id="btn-comprar" class="btn btn-success mt-2">
      Finalizar compra  
    </button>
  </div>

</div>
<script src="app.js"></script>

</body>
</html>
